# =====================================================
# 配置文件模板（提交到 Git）
# 使用方法：
#   1. 复制本文件为 application.yml
#      cp application.example.yml application.yml
#   2. 通过环境变量 DB_PASSWORD 传入真实数据库密码（不要写在这里）
#      或在 application.yml 中修改 password 字段
# =====================================================
spring:
  application:
    name: book-management-system
  datasource:
    url: jdbc:mysql://localhost:3307/booksystem?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    # 从环境变量读取数据库密码，未设置时启动会报错
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
